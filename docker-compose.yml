services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthotel-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-linkex-smarthotel-secret-key
      - ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL_ORIGINS=True
    restart: unless-stopped
